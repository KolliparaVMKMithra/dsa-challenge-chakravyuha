name: Automated Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            echo "🚀 [1/4] Connected to EC2. Navigating to project directory..."
            cd ~/dsa-challenge-chakravyuha

            echo "📥 [2/4] Pulling latest changes from GitHub main..."
            git fetch origin main
            git reset --hard origin/main

            echo "🐳 [3/4] Rebuilding and restarting application containers..."
            docker compose up -d --build

            echo "🧹 [4/4] Cleaning dangling build layers to conserve disk space..."
            docker image prune -f

            echo "✅ [SUCCESS] Deployment complete! Site live at https://chakravyuha-avv.tech"
